version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oil_sif_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OIL SIF Precursor Detection API
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=oil_sif
      - JWT_SECRET=production_super_secret_sif_key_change_me
      - FRONTEND_URL=http://localhost:5173
      - MODEL_PATH=ml/models/model.pkl
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: oil_sif_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
